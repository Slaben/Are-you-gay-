<!DOCTYPE html>
<html lang="sv">
<head>

<style>

const nej = document.getElementById("nej");

nej.addEventListener("click", function(e){
    e.preventDefault();
    klick++;

    if(klick === 1){
        nej.textContent = "Liar you are gay try again!";

        nej.style.display = "none";
